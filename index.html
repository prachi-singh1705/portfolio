<script>
// ═══ LOADER ═══
window.addEventListener('load',()=>{setTimeout(()=>{document.getElementById('loader').classList.add('h')},2200)});

// ═══ CURSOR ═══
const cd=document.getElementById('cd'),cr=document.getElementById('cr');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cd.style.left=mx-4+'px';cd.style.top=my-4+'px';
});
(function ac(){rx+=(mx-rx)*.15;ry+=(my-ry)*.15;cr.style.left=rx-20+'px';cr.style.top=ry-20+'px';requestAnimationFrame(ac)})();
document.querySelectorAll('a,button,.pj-card,.ct-card,.btn-p,.btn-o').forEach(el=>{
  el.addEventListener('mouseenter',()=>{cr.style.transform='scale(1.5)';cr.style.borderColor='var(--rose)'});
  el.addEventListener('mouseleave',()=>{cr.style.transform='scale(1)';cr.style.borderColor='var(--gold-l)'});
});

// ═══ NAV SCROLL ═══
window.addEventListener('scroll',()=>{document.getElementById('nav').classList.toggle('sc',scrollY>50)});

// ═══ HAMBURGER ═══
const ham=document.getElementById('ham'),navL=document.getElementById('navL');
ham.addEventListener('click',()=>{
  navL.classList.toggle('act');
  const s=ham.querySelectorAll('span');
  if(navL.classList.contains('act')){s[0].style.transform='rotate(45deg) translate(5px,5px)';s[1].style.opacity='0';s[2].style.transform='rotate(-45deg) translate(5px,-5px)'}
  else{s[0].style.transform='none';s[1].style.opacity='1';s[2].style.transform='none'}
});
navL.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navL.classList.remove('act');const s=ham.querySelectorAll('span');s[0].style.transform='none';s[1].style.opacity='1';s[2].style.transform='none'}));

// ═══ PARTICLES ═══
const cv=document.getElementById('particles'),cx=cv.getContext('2d');let W,H;
function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight}rsz();addEventListener('resize',rsz);
class P{constructor(){this.r()}r(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.s=Math.random()*2+.5;this.o=Math.random()*.3+.1;this.c=['#d4af37','#e91e63','#00e5ff','#7c4dff','#1de9b6'][Math.random()*5|0]}u(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.r()}d(){cx.beginPath();cx.arc(this.x,this.y,this.s,0,Math.PI*2);cx.fillStyle=this.c;cx.globalAlpha=this.o;cx.fill();cx.globalAlpha=1}}
const pts=Array.from({length:80},()=>new P);
(function ap(){cx.clearRect(0,0,W,H);pts.forEach(p=>{p.u();p.d()});for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle='rgba(212,175,55,'+(1-d/120)*.1+')';cx.stroke()}}requestAnimationFrame(ap)})();

// ═══ SCROLL REVEAL ═══
const obs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('act')})},{threshold:.1,rootMargin:'0px 0px -50px 0px'});
document.querySelectorAll('.rv').forEach(el=>obs.observe(el));

// ═══ COUNTER ═══
const cobs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting){const t=+x.target.dataset.target;let c=0;const tm=setInterval(()=>{c++;x.target.textContent=c;if(c>=t)clearInterval(tm)},200);cobs.unobserve(x.target)}})},{threshold:.5});
document.querySelectorAll('.stat-n[data-target]').forEach(c=>cobs.observe(c));

// ═══ PROJECT CARD GLOW ═══
document.querySelectorAll('.pj-card').forEach(c=>{c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');c.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')})});

// ═══ ABOUT CARD TILT ═══
const abCard=document.querySelector('.ab-card');
if(abCard){abCard.addEventListener('mousemove',e=>{const r=abCard.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;abCard.style.transform=`rotateY(${x*15}deg) rotateX(${-y*15}deg)`});abCard.addEventListener('mouseleave',()=>{abCard.style.transform='rotateY(0) rotateX(0)'})}

// ═══ CERTIFICATE LIGHTBOX (NO ALERT - SILENT) ═══
function openLB(src,title){
  if(!src || src.includes('undefined')) return;
  const lb=document.getElementById('lb');
  document.getElementById('lb-img').src=src;
  document.getElementById('lb-title').textContent=title;
  lb.classList.add('act');
  document.body.style.overflow='hidden';
}
function closeLB(){document.getElementById('lb').classList.remove('act');document.body.style.overflow=''}
document.getElementById('lb-img').addEventListener('click',e=>e.stopPropagation());

// ═══ SILENT IMAGE FALLBACK (NO ALERTS) ═══
function tryExts(img, basePath) {
  const exts = ['.jpg','.jpeg','.png','.webp','.JPG','.PNG','.JPEG','.gif'];
  let tried = 0;
  function tryNext() {
    if (tried >= exts.length) {
      // Silently show placeholder - NO ALERT
      img.style.display = 'none';
      const parent = img.parentElement;
      if(parent && !parent.querySelector('.cert-placeholder')){
        const ph = document.createElement('div');
        ph.className = 'cert-placeholder';
        ph.style.cssText = 'width:100%;height:220px;background:linear-gradient(135deg,#1a1a2e,#2a2a3e);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;';
        const icon = document.createElement('span');
        icon.style.cssText = 'font-size:3rem;';
        icon.textContent = '📜';
        const txt = document.createElement('span');
        txt.style.cssText = 'color:#a0a0b8;font-size:0.8rem;';
        txt.textContent = 'Certificate';
        ph.appendChild(icon);
        ph.appendChild(txt);
        parent.insertBefore(ph, parent.firstChild);
      }
      return;
    }
    img.onerror = function() { tryNext(); };
    img.src = basePath + exts[tried];
    tried++;
  }
  tryNext();
}

// ═══ SMOOTH SCROLL ═══
document.querySelectorAll('a[href^="#"]').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();const t=document.querySelector(a.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth',block:'start'})})});

// ═══ GIRL CHARACTER — CURSOR TRACKING ═══
const girlSvg = document.getElementById('girlSvg');
const headGroup = document.getElementById('headGroup');
const leftPupil = document.getElementById('leftPupil');
const rightPupil = document.getElementById('rightPupil');
const leftIris = document.getElementById('leftIris');
const rightIris = document.getElementById('rightIris');

document.addEventListener('mousemove', (e) => {
  if (!girlSvg || !headGroup) return;
  const rect = girlSvg.getBoundingClientRect();
  if (rect.width === 0) return;
  const faceCX = rect.left + rect.width * 0.5;
  const faceCY = rect.top + rect.height * 0.4;
  const dx = (e.clientX - faceCX) / (window.innerWidth * 0.5);
  const dy = (e.clientY - faceCY) / (window.innerHeight * 0.5);
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const ndx = clamp(dx, -1, 1);
  const ndy = clamp(dy, -1, 1);
  headGroup.style.transform = `translate(${ndx*8}px, ${ndy*5}px) rotate(${ndx*3}deg)`;
  headGroup.style.transition = 'transform 0.3s ease-out';
  const px = ndx * 4;
  const py = ndy * 3;
  if(leftPupil){ leftPupil.setAttribute('cx', 210 + px); leftPupil.setAttribute('cy', 211 + py); }
  if(leftIris){ leftIris.setAttribute('cx', 210 + px); leftIris.setAttribute('cy', 211 + py); }
  if(rightPupil){ rightPupil.setAttribute('cx', 244 + px); rightPupil.setAttribute('cy', 211 + py); }
  if(rightIris){ rightIris.setAttribute('cx', 244 + px); rightIris.setAttribute('cy', 211 + py); }
});

// Typing cursor
const st=document.createElement('style');
st.textContent=`.hero-sub::after{content:'|';animation:bl 1s step-end infinite;color:var(--gold);font-weight:300}@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}`;
document.head.appendChild(st);
</script>
